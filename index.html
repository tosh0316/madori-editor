<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>間取りエディタ — 木造在来ハウスジェネレータ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@300;400;500&family=Zen+Old+Mincho:wght@500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>
  /* cotomos VI v1.0 — 月白の地・藍墨の文字・藍鼠の構造線・秋桜は選択の1点だけ */
  :root{ --moon:#F7F9F8; --ink:#262D35; --sub:#5C6873; --nezu:#93A3AC; --rule:#D6DDDF; --kosumo:#A4587F;
    --sans:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    --mincho:"Zen Old Mincho","Yu Mincho","Hiragino Mincho ProN",serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none!important; }
  html,body{ margin:0; height:100%; overflow:hidden; font-family:var(--sans); font-weight:400; color:var(--ink); background:var(--moon); }
  button{ font-family:inherit; }
  #cv{ position:fixed; inset:0; touch-action:none; background:var(--moon); display:block; }

  #top{ position:fixed; top:0; left:0; right:0; height:46px; padding:0 14px; display:flex; gap:2px; align-items:center;
        z-index:5; background:var(--moon); border-bottom:1px solid var(--rule); font-size:12px; overflow-x:auto; }
  .ttl{ font-family:var(--mincho); font-weight:500; font-size:16px; letter-spacing:.08em; margin-right:16px; white-space:nowrap; }
  .tb{ background:none; border:none; color:var(--ink); font-size:12px; padding:6px 10px; border-radius:2px; cursor:pointer; white-space:nowrap; }
  .tb.on{ background:var(--ink); color:var(--moon); }
  .sep{ flex:0 0 1px; height:18px; background:var(--rule); margin:0 8px; }
  #stat{ margin-left:auto; padding-left:12px; font-family:var(--mono); font-size:11px; color:var(--sub); white-space:nowrap; }

  #bar{ position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; gap:2px; padding:8px 10px;
        background:var(--moon); border-top:1px solid var(--rule); }
  .btn{ flex:1 1 0; min-width:0; text-align:center; padding:10px 2px; border-radius:2px; background:none; color:var(--ink);
        font-size:13px; border:none; white-space:nowrap; cursor:pointer; }
  .btn.on{ background:var(--ink); color:var(--moon); }
  .btn.act{ color:var(--sub); }
  body:not([data-mode="edit"]) .btn[data-tool]{ display:none; }

  #toast{ position:fixed; top:56px; left:50%; transform:translateX(-50%); z-index:6; font-size:12px; color:var(--sub);
          background:var(--moon); padding:3px 10px; pointer-events:none; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }
  #toast:empty{ display:none; }
  #secbar{ position:fixed; top:54px; right:12px; z-index:6; display:flex; align-items:center; gap:2px; background:var(--moon); font-size:12px; }
  #secbar .nm{ font-family:var(--mono); padding:0 8px; }

  /* 左サイドパネル（選択要素の編集） */
  #side{ position:fixed; left:0; top:46px; bottom:59px; width:min(86vw,300px); z-index:7; background:var(--moon);
         border-right:1px solid var(--rule); transform:translateX(-105%); transition:transform .18s; overflow:auto; padding:20px 20px 28px; }
  #side.open{ transform:none; }
  #side h4{ font-weight:500; font-size:16px; margin:0 0 2px; letter-spacing:.02em; }
  #side .k{ font-size:11px; color:var(--sub); margin:0 0 14px; letter-spacing:.04em; }
  .f{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--rule); font-size:13px; }
  .f > span{ color:var(--sub); font-size:12px; }
  .f input,.f select{ width:120px; border:none; border-bottom:1px solid transparent; background:transparent; font-family:var(--mono); font-size:13px;
                      color:var(--ink); text-align:right; padding:2px 0; outline:none; border-radius:0; }
  .f input[type=text]{ font-family:var(--sans); }
  .f select{ font-family:var(--sans); text-align-last:right; }
  .f input:focus{ border-bottom-color:var(--ink); }
  .f .ro{ font-family:var(--mono); font-weight:400; }
  .grp{ font-size:11px; color:var(--sub); margin:22px 0 2px; letter-spacing:.1em; }
  .note{ font-size:11px; color:var(--sub); line-height:1.7; margin:10px 0 0; }
  .acts{ display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; }
  .lnk{ background:none; border:none; font-size:12px; color:var(--ink); padding:6px 0; cursor:pointer;
        text-decoration:underline; text-underline-offset:4px; text-decoration-color:var(--nezu); }
  .lnk.del{ color:var(--sub); }

  /* 右メニュー */
  #panel{ position:fixed; top:46px; right:0; bottom:59px; width:min(86vw,340px); background:var(--moon); z-index:10;
          transform:translateX(105%); transition:transform .2s; padding:8px 20px 28px; overflow:auto; border-left:1px solid var(--rule); }
  #panel.open{ transform:none; }
  #panel h3{ font-size:11px; font-weight:500; color:var(--sub); letter-spacing:.1em; margin:24px 0 2px; }
  #panel textarea{ width:100%; height:84px; font-family:var(--mono); font-size:11px; border:none; border-bottom:1px solid var(--rule);
                   background:transparent; color:var(--ink); resize:vertical; outline:none; padding:6px 0; }
  #panel .json{ height:170px; }
  .row{ display:flex; gap:18px; flex-wrap:wrap; margin:6px 0; }
  .hint{ font-size:11px; color:var(--sub); margin:6px 0 8px; line-height:1.7; }

  /* 3D */
  #three{ position:fixed; inset:0; z-index:8; display:none; background:var(--moon); }
  #three.on{ display:block; }
  #three .bar3{ position:fixed; top:0; left:0; right:0; height:46px; display:flex; align-items:center; gap:2px; padding:0 14px;
                background:var(--moon); border-bottom:1px solid var(--rule); z-index:9; font-size:12px; overflow-x:auto; }
  #three .tag{ position:fixed; bottom:14px; left:0; right:0; text-align:center; color:var(--sub); font-size:11px; }
  .dlab{ position:fixed; z-index:9; font-family:var(--mono); font-size:11px; color:var(--ink); background:var(--moon); padding:0 4px;
         transform:translateY(-50%); white-space:nowrap; pointer-events:none; display:none; }
</style>
</head>
<body data-mode="edit">
<canvas id="cv"></canvas>
<div id="top">
  <span class="ttl" id="ttl">間取り</span>
  <span id="lvs" style="display:flex;gap:2px"></span>
  <span class="sep"></span>
  <button class="tb on" data-v="edit">編集</button>
  <button class="tb" data-v="plan">平面図</button>
  <button class="tb" data-v="secX">X断面</button>
  <button class="tb" data-v="secY">Y断面</button>
  <button class="tb" id="planpng" hidden>PNG保存</button>
  <span class="sep"></span>
  <button class="tb" id="btn3d">3D</button>
  <span id="stat"></span>
</div>
<div id="toast"></div>
<div id="secbar" hidden><button class="tb" id="sec_prev">◀</button><span class="nm" id="sec_nm"></span><button class="tb" id="sec_next">▶</button></div>

<div id="bar">
  <button class="btn on" data-tool="select">選択</button>
  <button class="btn" data-tool="wall_outer">外壁</button>
  <button class="btn" data-tool="wall_inner">内壁</button>
  <button class="btn" data-tool="opening">開口</button>
  <button class="btn" data-tool="fitting">建具</button>
  <button class="btn" data-tool="floor">床</button>
  <button class="btn" data-tool="room">室</button>
  <button class="btn act" id="undo">戻す</button>
  <button class="btn act" id="menu">≡</button>
</div>

<aside id="side"></aside>

<div id="three">
  <div class="bar3">
    <span class="ttl">3D</span>
    <button class="tb" id="u3d">更新</button>
    <span class="sep"></span>
    <span id="modes" style="display:flex;gap:2px"><button class="tb on" data-m="3d">3D</button><button class="tb" data-m="elevX">X立面</button><button class="tb" data-m="elevY">Y立面</button></span>
    <span class="sep"></span>
    <span id="vfloors" style="display:flex;gap:2px"><button class="tb on" data-f="all">全体</button><button class="tb" data-f="noroof">屋根なし</button><button class="tb" data-f="1F">1F</button></span>
    <button class="tb" id="c3d" style="margin-left:auto">閉じる</button>
  </div>
  <div class="tag">ドラッグ=回転 / ピンチ=ズーム / 2本指=移動</div>
</div>

<div id="panel">
  <div class="row" style="justify-content:flex-end"><button class="lnk" id="close">閉じる</button></div>
  <h3>グリッド（通り芯）</h3>
  <label class="f"><span>初期ピッチ</span><input id="g_pitch" type="number" value="910"></label>
  <label class="f"><span>X通り数</span><input id="g_x" type="number" value="14"></label>
  <label class="f"><span>Y通り数</span><input id="g_y" type="number" value="11"></label>
  <div class="row"><button class="lnk" id="g_apply">等ピッチで再生成（要素は消える）</button></div>
  <div class="hint">通り芯の番号をタップ→左パネルで位置を変更（ドラッグも可）。要素は通り芯に追従。</div>

  <h3>開口の控除（単線 − 控除 ＝ 実開口の既定値）</h3>
  <label class="f"><span>窓 window</span><input id="d_window" type="number"></label>
  <label class="f"><span>ドア door</span><input id="d_door" type="number"></label>
  <label class="f"><span>建具 fitting</span><input id="d_fitting" type="number"></label>
  <div class="hint">開口は通り芯の交点〜交点の単線（例 1820）で引き、実開口（例 1690）は単線の中点に振り分けで置く。</div>

  <h3>基準高さ datum</h3>
  <textarea id="datums" spellcheck="false"></textarea>
  <div class="hint">name:mm を1行ずつ。FL/CL はレベル側（断面で編集）。</div>

  <h3>house.json（wood-house/0.3）</h3>
  <div class="row"><button class="lnk" id="export">生成</button><button class="lnk" id="copy">コピー</button><button class="lnk" id="dl">保存</button>
    <button class="lnk" id="import">取込</button><button class="lnk" id="loadex">例</button><button class="lnk del" id="clear">全消去</button></div>
  <textarea id="json" class="json" spellcheck="false"></textarea>
</div>

<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const C={moon:'#F7F9F8',ink:'#262D35',sub:'#5C6873',nezu:'#93A3AC',rule:'#D6DDDF',kosumo:'#A4587F'};
const FS='"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif', FM='"IBM Plex Mono",ui-monospace,Consolas,monospace';
const font=(px,mono,w)=>`${w||400} ${px}px ${mono?FM:FS}`;
const DEF_DATUMS={ "GL":0,"1FL":600,"1CL":2900,"2FL":3110,"2F梁天端":3100,"2CL":4930,"軒高":5340,"棟高":6960 };
const FITTYPES=["引戸","開き戸","片引戸","両引戸","襖","障子"];
const OTYPE={window:'窓',door:'ドア',fitting:'建具'};
const LOFF=30;   // 通り芯番号を根本から延長する画面px量
const S={ gx:[], gy:[], glx:[], gly:[], pitch:910, datums:{}, levels:[], walls:[], openings:[], floors:[], rooms:[], roofs:[],
  rules:{deduct:{window:130,door:40,fitting:0}}, base:null, title:'間取り' };
let view={s:0.06,px:0,py:0}, planSaved=null;
let cur={lv:'1F',tool:'select',p1:null,floorPts:null,sel:null,mode:'edit',cut:{secX:null,secY:null},handles:[]};
const r1=v=>Math.round(v*10)/10;
function uniform(n,p){ const a=[]; for(let i=0;i<n;i++)a.push(i*p); return a; }

// ---------- 座標 ----------
const NX=()=>S.gx.length, NY=()=>S.gy.length;
const X0=()=>S.gx[0]||0, X1=()=>S.gx[NX()-1]||0, Y0=()=>S.gy[0]||0, Y1=()=>S.gy[NY()-1]||0;
function sx(x){return view.px+x*view.s;} function sy(y){return view.py-y*view.s;}
function wx(p){return (p-view.px)/view.s;} function wy(p){return (view.py-p)/view.s;}
function nidx(arr,v){ let bi=0,bd=1e18; for(let i=0;i<arr.length;i++){const d=Math.abs(arr[i]-v);if(d<bd){bd=d;bi=i;}} return bi; }
function snap(px,py){ return {i:nidx(S.gx,wx(px)), j:nidx(S.gy,wy(py))}; }
function P(p){ return [S.gx[p.i], S.gy[p.j]]; }
function distSeg(p,A,B){ const dx=B[0]-A[0],dy=B[1]-A[1],L=dx*dx+dy*dy; let t=L?((p[0]-A[0])*dx+(p[1]-A[1])*dy)/L:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-(A[0]+t*dx),p[1]-(A[1]+t*dy)); }
function segDistS(px,py,A,B){ return distSeg([px,py],[sx(A[0]),sy(A[1])],[sx(B[0]),sy(B[1])]); }
function nid(pre,list){ let n=list.length+1; while(list.some(x=>x.id===pre+n)) n++; return pre+n; }
const isSec=m=>m==='secX'||m==='secY';

// ---------- 履歴 ----------
const hist=[];
function core(){ return {gx:S.gx,gy:S.gy,glx:S.glx,gly:S.gly,datums:S.datums,levels:S.levels,walls:S.walls,openings:S.openings,floors:S.floors,rooms:S.rooms,roofs:S.roofs,rules:S.rules}; }
function mut(){ hist.push(JSON.stringify(core())); if(hist.length>100)hist.shift(); }
function undo(){ if(cur.floorPts&&cur.floorPts.length){cur.floorPts.pop();draw();return;} if(cur.p1){cur.p1=null;draw();return;}
  const s=hist.pop(); if(!s){ toast('これ以上戻せません',1500); return; } Object.assign(S,JSON.parse(s)); clearSel(); renderLevels(); draw(); }

// ---------- 開口（単線 a→b ＋ 実開口幅 width を中点振り分け）----------
function oLine(o){ return [P(o.a),P(o.b)]; }
function oSeg(o){ const [A,B]=oLine(o); const L=Math.hypot(B[0]-A[0],B[1]-A[1]); const w=S.walls.find(x=>x.id===o.host);
  let ux=1,uy=0; if(L>0){ux=(B[0]-A[0])/L;uy=(B[1]-A[1])/L;} else if(w){ const a=P(w.a),b=P(w.b),l=Math.hypot(b[0]-a[0],b[1]-a[1])||1; ux=(b[0]-a[0])/l; uy=(b[1]-a[1])/l; }
  const M=[(A[0]+B[0])/2,(A[1]+B[1])/2]; const hw=(o.width||0)/2;
  return {a:[M[0]-ux*hw,M[1]-uy*hw], b:[M[0]+ux*hw,M[1]+uy*hw], m:M, u:[ux,uy], span:L}; }
function dedOf(t){ const d=(S.rules&&S.rules.deduct)||{}; return +(d[t]!=null?d[t]:0); }
function defWidth(o){ return Math.max(0,Math.round(oSeg(o).span-dedOf(o.type))); }
function onWall(p,w){ return distSeg(p,P(w.a),P(w.b))<=1; }
function hostFor(a,b,lv){ const A=P(a),B=P(b); return S.walls.find(w=>w.level===lv&&onWall(A,w)&&onWall(B,w)); }
function openingOK(o){ const w=S.walls.find(x=>x.id===o.host); if(!w)return false; const [A,B]=oLine(o); const sg=oSeg(o);
  return onWall(A,w)&&onWall(B,w)&&sg.span>0&&o.width<=sg.span+0.5; }

// ---------- 高さ ----------
function lvOf(id){ return S.levels.find(l=>l.id===id)||{id,fl:0,cl:2400}; }
function topLevelId(){ const ids=new Set(S.walls.map(w=>w.level)); const ls=S.levels.filter(l=>ids.has(l.id)).sort((p,q)=>p.fl-q.fl); return ls.length?ls[ls.length-1].id:null; }
function wallZ(w){ const L=lvOf(w.level);
  if(w.base&&S.datums[w.base]!=null) return [S.datums[w.base]+(+w.h0||0), (S.datums[w.top]!=null?S.datums[w.top]:L.cl)+(+w.h1||0)];
  return [L.fl,L.cl]; }
function wallTopAt(w,x,y,isTop){ const z1=wallZ(w)[1]; const r=RK.roofZ(S.roofs,x,y); if(r==null)return z1; return isTop?r:Math.min(z1,r); }

// ---------- 屋根キット（v0.3: axis + eaves[{pos,z}] + ridge{pos,z}。3Dと断面で共用）----------
const RK={
  bb(o){ const b=o.boundary||[]; if(!b.length)return null; const xs=b.map(p=>+p[0]),ys=b.map(p=>+p[1]);
    return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}; },
  knots(o){ return [...(o.eaves||[]),...(o.ridge&&o.ridge.pos!=null?[o.ridge]:[])].map(k=>({pos:+k.pos,z:+k.z,ref:k})).sort((a,b)=>a.pos-b.pos); },
  slopeAlong(o){ return o.axis==='x'?1:0; },   // 勾配が変化する座標（0=x, 1=y）。axis は棟の向き
  zAt(o,x,y){ const k=RK.knots(o); if(!k.length)return null; if(k.length===1)return k[0].z; const t=RK.slopeAlong(o)?y:x;
    let i=0; while(i<k.length-2&&t>k[i+1].pos)i++; const a=k[i],b=k[i+1],d=(b.pos-a.pos)||1; return a.z+(b.z-a.z)*(t-a.pos)/d; },
  inBox(o,x,y,ov){ const b=RK.bb(o); if(!b)return false; return x>=b.x0-ov-0.5&&x<=b.x1+ov+0.5&&y>=b.y0-ov-0.5&&y<=b.y1+ov+0.5; },
  pick(roofs,x,y){ let best=null,bz=-1e18;
    for(const pass of [0,1]){ for(const o of roofs||[]){ if(!RK.inBox(o,x,y,pass?(+o.overhang||0):0))continue; const z=RK.zAt(o,x,y); if(z!=null&&z>bz){bz=z;best=o;} } if(best)return best; }
    return null; },
  roofZ(roofs,x,y){ const o=RK.pick(roofs,x,y); return o?RK.zAt(o,x,y):null; },
  slopes(o){ const k=RK.knots(o),r=[]; for(let i=0;i<k.length-1;i++){ const run=Math.abs(k[i+1].pos-k[i].pos),rise=Math.abs(k[i+1].z-k[i].z),tn=run?rise/run:0;
    r.push({deg:Math.atan(tn)*180/Math.PI,sun:tn*10}); } return r; },
  breaks(roofs,A,B){ const L=Math.hypot(B[0]-A[0],B[1]-A[1]); if(L<1e-6)return [0]; const ux=(B[0]-A[0])/L,uy=(B[1]-A[1])/L,out=[0,L];
    const add=(ax,v,eps)=>{ const u=ax?uy:ux; if(Math.abs(u)<1e-9)return; const s=(v-A[ax])/u; for(const e of eps){ const q=s+e; if(q>0&&q<L)out.push(q);} };
    for(const o of roofs||[]){ const b=RK.bb(o); if(!b)continue; const ov=+o.overhang||0, J=[-0.5,0.5];
      [b.x0,b.x1,b.x0-ov,b.x1+ov].forEach(v=>add(0,v,J)); [b.y0,b.y1,b.y0-ov,b.y1+ov].forEach(v=>add(1,v,J));
      for(const k of RK.knots(o)) add(RK.slopeAlong(o),k.pos,[0]); }
    return [...new Set(out.map(v=>Math.round(v*100)/100))].sort((a,b)=>a-b); }
};
window.RK=RK;

// ---------- 画面 ----------
function resize(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); draw(); }
addEventListener('resize',resize);
function fit(){ const m=56,top=64,bot=84; const W=(X1()-X0())||1, H=(Y1()-Y0())||1; const aw=innerWidth-2*m-LOFF, ah=innerHeight-top-bot-LOFF;
  view.s=Math.min(aw/W,ah/H); view.px=m+LOFF+(aw-W*view.s)/2-X0()*view.s; view.py=innerHeight-bot-LOFF-(ah-H*view.s)/2+Y0()*view.s; }
function lineS(x1,y1,x2,y2,col,w){ ctx.strokeStyle=col; ctx.lineWidth=w||1; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function lineW(a,b,col,w){ lineS(sx(a[0]),sy(a[1]),sx(b[0]),sy(b[1]),col,w); }
function fillPolyW(poly,style){ ctx.fillStyle=style; ctx.beginPath(); poly.forEach((p,i)=>{i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1]));}); ctx.closePath(); ctx.fill(); }
function txt(t,x,y,f,col,al,bl){ ctx.font=f; ctx.fillStyle=col; ctx.textAlign=al||'center'; ctx.textBaseline=bl||'middle'; ctx.fillText(t,x,y); }
let toastT=null;
function toast(t,ms){ const el=document.getElementById('toast'); el.textContent=t||''; clearTimeout(toastT); if(ms) toastT=setTimeout(toolHint,ms); }
const isSel=o=>cur.sel&&cur.sel.o===o;
const isSelAxis=(a,i)=>cur.sel&&cur.sel.type==='axis'&&cur.sel.a===a&&cur.sel.i===i;
function wallOnLine(a,i){ return S.walls.some(w=>a==='x'?(w.a.i===i&&w.b.i===i):(w.a.j===i&&w.b.j===i)); }

// ---------- 断面（X断面: y=一定で切り x を横軸 / Y断面: x=一定で切り y を横軸）----------

// ---------- 読込（v0.2 トークン / v0.3 mm を mm に正規化 → 通り芯インデックス）----------
function loadHouse(h){ const raw=JSON.parse(JSON.stringify(h)); S.base=raw; const g=raw.grid||{};
  let bx,by;
  if(Array.isArray(g.x)&&g.x.length&&typeof g.x[0]==='object'){ bx=g.x.map(a=>({p:+a.pos,l:a.label})); by=(g.y||[]).map(a=>({p:+a.pos,l:a.label}));
    S.pitch=g.pitch||(bx.length>1?Math.round(bx[1].p-bx[0].p):910)||910; }
  else { const p=g.pitch||910, xs=g.x_positions||uniform(g.x_axes||14,p), ys=g.y_positions||uniform(g.y_axes||11,p);
    bx=xs.map((v,i)=>({p:v,l:'X'+(i+1)})); by=ys.map((v,i)=>({p:v,l:'Y'+(i+1)})); S.pitch=p; }
  const axv=(arr,t)=>{ const f=parseFloat(String(t).slice(1))-1, lo=Math.max(0,Math.min(arr.length-1,Math.floor(f))), hi=Math.max(0,Math.min(arr.length-1,Math.ceil(f)));
    if(lo===hi)return arr[lo].p; const k=f-Math.floor(f); return arr[lo].p*(1-k)+arr[hi].p*k; };
  const mm=p=>(Array.isArray(p)&&typeof p[0]==='string')?[axv(bx,p[0]),axv(by,p[1])]:[+p[0],+p[1]];
  S.rules=Object.assign({},raw.opening_rules||{},{deduct:Object.assign({window:130,door:40,fitting:0},(raw.opening_rules||{}).deduct||{})});
  S.datums=Object.assign({},raw.datums||{});
  S.levels=(raw.levels||[]).map(l=>Object.assign({},l,{fl:+l.fl||0,cl:+(l.cl!=null?l.cl:2400)}));
  if(!S.levels.length) S.levels=[{id:'1F',fl:600,cl:2900}];
  const W=(raw.walls||[]).map((w,n)=>{ const t=(w.thickness&&typeof w.thickness==='object')?(+w.thickness.out||0)+(+w.thickness.in||0):(+w.thickness||(w.kind==='inner'?105:150));
    return {id:w.id||('W'+(n+1)),kind:w.kind||'outer',level:w.level||'1F',A:mm(w.from),B:mm(w.to),t,base:w.base||null,top:w.top||null,h0:+w.h0||0,h1:+w.h1||0,raw:w}; });
  const ops=[...(raw.openings||[]).map(o=>({o,fit:false})),...(raw.fittings||[]).map(o=>({o,fit:true}))];
  const O=ops.map(({o,fit},n)=>{ const type=fit?'fitting':(o.type||'window'), w=W.find(x=>x.id===o.host); let A,B;
    if(o.from&&o.to){ A=mm(o.from); B=mm(o.to); }
    else if(o.at){ const Cc=mm(o.at); A=Cc; B=Cc;
      if(w){ const L=Math.hypot(w.B[0]-w.A[0],w.B[1]-w.A[1])||1, ux=(w.B[0]-w.A[0])/L, uy=(w.B[1]-w.A[1])/L;
        const d=+(S.rules.deduct[type]||0), span=Math.min(L,Math.ceil(((+o.width||900)+d-1)/S.pitch)*S.pitch);
        let s=(Cc[0]-w.A[0])*ux+(Cc[1]-w.A[1])*uy; s=Math.max(span/2,Math.min(L-span/2,s));
        A=[w.A[0]+ux*(s-span/2),w.A[1]+uy*(s-span/2)]; B=[w.A[0]+ux*(s+span/2),w.A[1]+uy*(s+span/2)]; } }
    else return null;
    return {id:o.id||((fit?'K':'O')+(n+1)),type,op:fit?(o.type||'引戸'):(o.operation||''),host:o.host||null,level:o.level||'1F',A,B,
      width:+o.width||0,sill:+(o.sill!=null?o.sill:(fit?0:400)),head:+(o.head!=null?o.head:2000),raw:fit?Object.assign({},o,{type:'fitting'}):o}; }).filter(Boolean);
  const closed=b=>b.length>2&&b[0][0]===b[b.length-1][0]&&b[0][1]===b[b.length-1][1];
  const Fl=(raw.floors||[]).filter(f=>f.boundary&&f.boundary.length).map((f,n)=>{ let b=f.boundary.map(mm); const cl=closed(b); if(cl)b=b.slice(0,-1);
    return {id:f.id||('FL'+(n+1)),level:f.level||'1F',B:b,finish:f.finish||null,closed:cl,raw:f}; });
  const R=(raw.rooms||[]).map((r,n)=>{ let b=r.boundary&&r.boundary.length?r.boundary.map(mm):null; const cl=b?closed(b):false; if(cl)b=b.slice(0,-1);
    return {id:r.id||('R'+(n+1)),name:r.name||'室',level:r.level||'1F',B:b,closed:cl,at:r.label_at?mm(r.label_at):null,raw:r}; });
  S.roofs=(((raw.roof||{}).outlines)||[]).map(o=>{ const r=JSON.parse(JSON.stringify(o)); r.boundary=(o.boundary||[]).map(mm);
    if(!r.eaves&&r.ridge&&r.ridge.axis){ const b=RK.bb(r), rx=axv(bx,r.ridge.axis), rz=+r.ridge.z, tn=Math.tan((o.pitch_deg||20)*Math.PI/180);
      r.axis='y'; r.ridge={pos:r1(rx),z:rz}; r.eaves=[{pos:b.x0,z:r1(rz-tn*(rx-b.x0))},{pos:b.x1,z:r1(rz-tn*(b.x1-rx))}];
      delete r.pitch_deg; delete r.equal_pitch; delete r.eave_h0; }
    return r; });
  for(const w of W) if(!S.levels.some(l=>l.id===w.level)){ const top=S.levels.reduce((m,l)=>Math.max(m,l.cl),0); S.levels.push({id:w.level,fl:top+200,cl:top+2600}); }

  const xs=bx.map(a=>a.p), ys=by.map(a=>a.p), push=p=>{ xs.push(p[0]); ys.push(p[1]); };
  W.forEach(w=>{push(w.A);push(w.B);}); O.forEach(o=>{push(o.A);push(o.B);}); Fl.forEach(f=>f.B.forEach(push)); R.forEach(r=>(r.B||[]).forEach(push));
  const uq=arr=>{ const s=arr.map(v=>r1(v)).sort((a,b)=>a-b), out=[]; for(const v of s){ if(!out.length||v-out[out.length-1]>1) out.push(v); } return out; };
  S.gx=uq(xs); S.gy=uq(ys);
  S.glx=S.gx.map(v=>{ const a=bx.find(b=>Math.abs(b.p-v)<=1); return a?a.l:null; }); S.gly=S.gy.map(v=>{ const a=by.find(b=>Math.abs(b.p-v)<=1); return a?a.l:null; });
  const I=p=>({i:nidx(S.gx,p[0]),j:nidx(S.gy,p[1])});
  S.walls=W.map(w=>({id:w.id,kind:w.kind,level:w.level,a:I(w.A),b:I(w.B),t:w.t,base:w.base,top:w.top,h0:w.h0,h1:w.h1,raw:w.raw}));
  S.openings=O.map(o=>({id:o.id,type:o.type,op:o.op,host:o.host,level:o.level,a:I(o.A),b:I(o.B),width:o.width,sill:o.sill,head:o.head,raw:o.raw}));
  S.floors=Fl.map(f=>({id:f.id,level:f.level,pts:f.B.map(I),finish:f.finish,closed:f.closed,raw:f.raw}));
  S.rooms=R.map(r=>({id:r.id,name:r.name,level:r.level,pts:r.B?r.B.map(I):null,closed:r.closed,at:r.at,raw:r.raw}));
  S.title=(raw.meta&&(raw.meta.name||raw.meta.title))||'間取り'; document.getElementById('ttl').textContent=S.title;
  hist.length=0; cur.cut={secX:null,secY:null}; clearSel(); renderLevels(); fit(); }

// ---------- 書出し（wood-house/0.3。読込時の未知キーは素通し）----------
function buildHouse(){ const out=JSON.parse(JSON.stringify(S.base||{})); const MP=p=>[r1(S.gx[p.i]),r1(S.gy[p.j])];
  out.schema='wood-house/0.3'; out.units='mm';
  const gx=[],gy=[]; S.gx.forEach((v,i)=>{ if(S.glx[i]) gx.push({label:S.glx[i],pos:r1(v)}); }); S.gy.forEach((v,j)=>{ if(S.gly[j]) gy.push({label:S.gly[j],pos:r1(v)}); });
  out.grid=Object.assign({},(out.grid&&Array.isArray(out.grid.x))?out.grid:{},{x:gx,y:gy});
  out.levels=JSON.parse(JSON.stringify(S.levels)); out.datums=JSON.parse(JSON.stringify(S.datums));
  out.walls=S.walls.map(w=>{ const r=Object.assign({},w.raw||{}); r.id=w.id; r.kind=w.kind; r.level=w.level; r.from=MP(w.a); r.to=MP(w.b);
    const rt=(w.raw||{}).thickness; r.thickness=(rt&&typeof rt==='object'&&(+rt.out||0)+(+rt.in||0)===w.t)?rt:{out:w.t/2,in:w.t/2};
    if(w.base){ r.base=w.base; r.h0=w.h0||0; r.top=w.top; r.h1=w.h1||0; } else { delete r.base; delete r.h0; delete r.top; delete r.h1; } return r; });
  out.openings=S.openings.map(o=>{ const r=Object.assign({},o.raw||{}); delete r.at; r.id=o.id; r.type=o.type; r.host=o.host; r.level=o.level;
    r.from=MP(o.a); r.to=MP(o.b); r.width=o.width; r.sill=o.sill; r.head=o.head; if(o.op) r.operation=o.op; return r; });
  delete out.fittings;
  out.floors=S.floors.map(f=>{ const r=Object.assign({},f.raw||{}); r.id=f.id; r.level=f.level; const b=f.pts.map(MP); if(f.closed)b.push(b[0]); r.boundary=b; r.finish=f.finish||null; return r; });
  out.rooms=S.rooms.map(rm=>{ const r=Object.assign({},rm.raw||{}); r.id=rm.id; r.name=rm.name; r.level=rm.level;
    if(rm.pts){ const b=rm.pts.map(MP); if(rm.closed)b.push(b[0]); r.boundary=b; } if(rm.at) r.label_at=[r1(rm.at[0]),r1(rm.at[1])]; return r; });

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('three'), RK=window.RK;

const COL={bg:0xF7F9F8,outer:0xE3E8E9,inner:0xCBD3D7,floor:0xE9EDED,roof:0x93A3AC,edge:0x262D35,win:0xB9C8D0,door:0x5C6873,fit:0xC9D2D6};
function onResize(){ if(!renderer)return; renderer.setSize(innerWidth,innerHeight); if(camP){camP.aspect=innerWidth/innerHeight;camP.updateProjectionMatrix();} if(mode!=='3d')applyOrtho(); }
addEventListener('resize',onResize);

function init(){ renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight); host.appendChild(renderer.domElement);
  scene=new THREE.Scene(); scene.background=new THREE.Color(COL.bg);

  scene.add(new THREE.HemisphereLight(0xffffff,0x8a949a,1.2)); const dl=new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(-1,2,1.3); scene.add(dl);
  root=new THREE.Group(); scene.add(root); datumGrp=new THREE.Group(); scene.add(datumGrp); inited=true; animate(); }
function animate(){ if(!host.classList.contains('on'))return; requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); if(mode!=='3d')updateLabels(); }
const V=(x,y,z)=>new THREE.Vector3(x,z,-y);   // 建物座標 (x,y,z) → three (x,z,-y)
function addEdges(mesh,op){ const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,25),new THREE.LineBasicMaterial({color:COL.edge,transparent:true,opacity:op||.28}));
  e.applyMatrix4(mesh.matrix); e.userData.lvl=mesh.userData.lvl; root.add(e); }
function wallMesh(a,b,z0,z1,th,color,isTop,roofs){ const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy); if(len<1)return null; const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  const topAt=s=>{ const bx=a[0]+ux*s,by=a[1]+uy*s; let best=null;   // 板厚方向にも屋根高を取り最小＝屋根が壁を覆う
    for(const d of [-th/2,0,th/2]){ const rz=RK.roofZ(roofs,bx+nx*d,by+ny*d); const tv=rz==null?z1:(isTop?rz:Math.min(z1,rz)); best=best==null?tv:Math.min(best,tv); }
    return Math.max(z0+20,best); };
  const bps=RK.breaks(roofs,a,b); const sh=new THREE.Shape(); sh.moveTo(0,z0); sh.lineTo(len,z0);
  for(let k=bps.length-1;k>=0;k--) sh.lineTo(bps[k],topAt(bps[k]));
  const geo=new THREE.ExtrudeGeometry(sh,{depth:th,bevelEnabled:false});
  const dir3=new THREE.Vector3(ux,0,-uy),up3=new THREE.Vector3(0,1,0),perp3=new THREE.Vector3().crossVectors(dir3,up3).normalize();
  const m=new THREE.Matrix4().makeBasis(dir3,up3,perp3); m.setPosition(a[0]-perp3.x*th/2,-perp3.y*th/2,-a[1]-perp3.z*th/2);
  geo.applyMatrix4(m); geo.computeVertexNormals(); return new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color})); }
function quad(p,color){ const g=new THREE.BufferGeometry(); const v=p.map(q=>V(q[0],q[1],q[2]));
  g.setAttribute('position',new THREE.Float32BufferAttribute(v.flatMap(q=>[q.x,q.y,q.z]),3)); g.setIndex([0,1,2,0,2,3]); g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide})); }
function clearRoot(){ scene.remove(root); root.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); }); root=new THREE.Group(); scene.add(root); }
function build(){ if(!inited)return; clearRoot(); const h=window.getHouse(); const roofs=(h.roof&&h.roof.outlines)||[]; const lv={}; (h.levels||[]).forEach(l=>lv[l.id]=l);
  const wl=new Set((h.walls||[]).map(w=>w.level)); const tl=(h.levels||[]).filter(l=>wl.has(l.id)).sort((p,q)=>p.fl-q.fl); const topLevel=tl.length?tl[tl.length-1].id:null;
  const dz=(n,off)=>(h.datums&&h.datums[n]!=null?h.datums[n]:0)+(+off||0);
  const wz=w=>{ const L=lv[w.level]||{fl:0,cl:2400}; if(w.base&&h.datums&&h.datums[w.base]!=null) return [dz(w.base,w.h0),(h.datums[w.top]!=null?dz(w.top,w.h1):L.cl)]; return [L.fl,L.cl]; };
  const thk=w=>(w.thickness&&typeof w.thickness==='object')?(+w.thickness.out||0)+(+w.thickness.in||0):(+w.thickness||(w.kind==='outer'?150:105));
  for(const w of h.walls||[]){ const [z0,z1]=wz(w); const m=wallMesh(w.from,w.to,z0,z1,thk(w),w.kind==='outer'?COL.outer:COL.inner,w.level===topLevel,roofs);
    if(m){ m.userData.lvl=w.level; root.add(m); addEdges(m); } }
  for(const f of h.floors||[]){ const L=lv[f.level]||{fl:0}; const b=f.boundary||[]; if(b.length<3)continue; const sh=new THREE.Shape(); b.forEach((q,i)=>i?sh.lineTo(q[0],q[1]):sh.moveTo(q[0],q[1]));
    const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshLambertMaterial({color:COL.floor,side:THREE.DoubleSide})); m.rotation.x=-Math.PI/2; m.position.y=(L.fl||0)+2; m.userData.lvl=f.level; root.add(m); }
  for(const o of h.openings||[]){ const w=(h.walls||[]).find(x=>x.id===o.host); if(!w)continue;
    const A=o.from||o.at, B=o.to||o.at; if(!A)continue; const M=[(A[0]+B[0])/2,(A[1]+B[1])/2];
    const dx=w.to[0]-w.from[0],dy=w.to[1]-w.from[1],wl_=Math.hypot(dx,dy)||1,ux=dx/wl_,uy=dy/wl_,ang=Math.atan2(dy,dx);
    const base=(w.base&&h.datums&&h.datums[w.base]!=null)?wz(w)[0]:(lv[o.level]||{fl:0}).fl;
    const wd=Math.max(10,+o.width||0); let bot=base+(+o.sill||0), top=base+(+o.head||2000);
    let rz=Infinity; for(const f of [-0.5,-0.25,0,0.25,0.5]){ const r=RK.roofZ(roofs,M[0]+ux*wd*f,M[1]+uy*wd*f); if(r!=null)rz=Math.min(rz,r); }
    if(isFinite(rz)&&rz<top) top=Math.max(bot+50,rz);
    const c=o.type==='door'?COL.door:o.type==='fitting'?COL.fit:COL.win;
    const m=new THREE.Mesh(new THREE.BoxGeometry(wd,Math.max(50,top-bot),thk(w)+40),new THREE.MeshLambertMaterial({color:c,transparent:true,opacity:.85}));
    m.position.set(M[0],(top+bot)/2,-M[1]); m.rotation.y=ang; m.updateMatrix(); m.userData.lvl=o.level; root.add(m); }
  for(const o of roofs){ const b=RK.bb(o); if(!b)continue; const ov=+o.overhang||0, ax=RK.slopeAlong(o), kn=RK.knots(o); if(!kn.length)continue;
    const s0=(ax?b.y0:b.x0)-ov, s1=(ax?b.y1:b.x1)+ov, t0=(ax?b.x0:b.y0)-ov, t1=(ax?b.x1:b.y1)+ov;
    const ss=[s0,...kn.map(k=>k.pos).filter(p=>p>s0&&p<s1),s1].sort((p,q)=>p-q);
    const pt=(s,t)=>{ const x=ax?t:s, y=ax?s:t; return [x,y,RK.zAt(o,x,y)]; };
    for(let i=0;i<ss.length-1;i++){ const m=quad([pt(ss[i],t0),pt(ss[i+1],t0),pt(ss[i+1],t1),pt(ss[i],t1)],COL.roof); m.userData.lvl='roof'; root.add(m); addEdges(m,.5); } }
  lastH=h; setMode(mode); setVFloor(vfloor); }
function setVFloor(f){ vfloor=f; document.querySelectorAll('#vfloors button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  root.children.forEach(m=>{ const L=m.userData.lvl; m.visible= f==='all'?true : f==='1F'?(L==='1F') : (L!=='roof'); }); }
function bbox(){ return new THREE.Box3().setFromObject(root); }
function frame3D(){ const box=bbox(); if(box.isEmpty())return; const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z,3000);

function applyOrtho(){ const box=bbox(); if(box.isEmpty())return; const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()),asp=innerWidth/innerHeight;
  let hW=Math.max(mode==='elevX'?s.x:s.z,1000), vH=Math.max(s.y,1000); let halfW=hW*0.62,halfH=vH*0.62; if(halfW/halfH<asp)halfW=halfH*asp; else halfH=halfW/asp;
  camO.left=-halfW; camO.right=halfW; camO.top=halfH; camO.bottom=-halfH; const dist=Math.max(s.x,s.y,s.z)*3+20000;
  if(mode==='elevX')camO.position.set(c.x,c.y,c.z+dist); else camO.position.set(c.x+dist,c.y,c.z);
  camO.near=1; camO.far=dist*3; camO.up.set(0,1,0); camO.updateProjectionMatrix(); controls.target.copy(c); controls.update(); }
function rebuildDatums(){ datumGrp.clear(); labelEls.forEach(e=>e.remove()); labelEls=[]; labelPos=[];
  if(mode==='3d'||!lastH)return; const box=bbox(); if(box.isEmpty())return; const mn=box.min,mx=box.max;
  const ds=[]; (lastH.levels||[]).forEach(l=>{ ds.push([l.id+' FL',+l.fl]); ds.push([l.id+' CL',+l.cl]); }); Object.entries(lastH.datums||{}).forEach(([k,v])=>ds.push([k,+v]));
  if(!ds.length)return; ds.sort((a,b)=>a[1]-b[1]);
  const mgx=(mx.x-mn.x)*0.10+600, mgz=(mx.z-mn.z)*0.10+600, mat=new THREE.LineBasicMaterial({color:0x93A3AC}), lx=mn.x-mgx;
  for(const [nm,z] of ds){ let pts,lp;
    if(mode==='elevX'){ pts=[new THREE.Vector3(lx,z,mx.z),new THREE.Vector3(mx.x+mgx*0.3,z,mx.z)]; lp=new THREE.Vector3(lx,z,mx.z); }
    else { pts=[new THREE.Vector3(mn.x,z,mn.z-mgz),new THREE.Vector3(mn.x,z,mx.z+mgz*0.3)]; lp=new THREE.Vector3(mn.x,z,mn.z-mgz); }
    datumGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
    const el=document.createElement('div'); el.className='dlab'; el.textContent=nm+' '+Math.round(z); host.appendChild(el); labelEls.push(el); labelPos.push(lp); } }
function updateLabels(){ for(let i=0;i<labelEls.length;i++){ const v=labelPos[i].clone().project(camera);
  if(v.z<-1||v.z>1){ labelEls[i].style.display='none'; continue; }
  labelEls[i].style.display='block'; labelEls[i].style.left=((v.x*0.5+0.5)*innerWidth)+'px'; labelEls[i].style.top=((-v.y*0.5+0.5)*innerHeight)+'px'; } }
function setMode(m){ mode=m; document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>間取りエディタ — 木造在来ハウスジェネレータ</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>
  :root{ --bg:#8f979e; --ink:#1a1a1a; --panel:#f5f4f1; --accent:#2f6db0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; color:var(--ink); }
  #cv{ position:fixed; inset:0; touch-action:none; background:var(--bg); display:block; }
  #top{ position:fixed; top:0; left:0; right:0; padding:6px 10px; font-size:12px; color:#fff;
        background:rgba(0,0,0,.45); display:flex; gap:8px; align-items:center; z-index:5; }
  #top b{ font-weight:600; }
  .lv{ padding:3px 9px; border-radius:12px; background:#fff3; }
  .lv.on{ background:var(--accent); }
  #bar{ position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; flex-wrap:nowrap;
        gap:4px; padding:6px 5px; background:rgba(20,20,20,.82); }
  .btn{ flex:1 1 0; min-width:0; text-align:center; padding:11px 2px; border-radius:7px;
        background:#3a3a3a; color:#eee; font-size:12px; border:none; white-space:nowrap; }
  .btn.on{ background:var(--accent); color:#fff; }
  .btn.act{ background:#5a5a5a; }
  .sheet{ position:fixed; left:0; right:0; bottom:58px; z-index:7; background:var(--panel);
    border-radius:14px 14px 0 0; box-shadow:0 -4px 18px #0004; padding:12px 14px; transform:translateY(120%); transition:.18s; max-height:60vh; overflow:auto; }
  .sheet.open{ transform:none; }
  .sheet h4{ margin:2px 0 8px; font-size:14px; }
  .sheet label{ display:flex; justify-content:space-between; align-items:center; font-size:13px; margin:6px 0; gap:8px; }
  .sheet input,.sheet select{ width:140px; padding:6px; font-size:13px; }
  .sheet .del{ background:#b23; color:#fff; border:none; padding:9px 14px; border-radius:8px; }
  .sheet .ok{ background:var(--accent); color:#fff; border:none; padding:9px 14px; border-radius:8px; }
  .sheet .rowb{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  #axisbox{ position:fixed; left:50%; transform:translateX(-50%); bottom:64px; z-index:7; display:none;
    background:#222d; color:#fff; border-radius:10px; padding:8px 10px; font-size:13px; align-items:center; gap:6px; }
  #axisbox.open{ display:flex; }
  #axisbox button{ background:#444; color:#fff; border:none; border-radius:6px; padding:6px 9px; font-size:14px; }
  #axisbox .nm{ font-weight:700; margin-right:4px; }
  #panel{ position:fixed; top:0; right:0; bottom:0; width:min(86vw,360px); background:var(--panel);
          z-index:10; transform:translateX(100%); transition:.2s; padding:14px; overflow:auto; }
  #panel.open{ transform:none; box-shadow:-4px 0 20px #0005; }
  #panel h3{ margin:12px 0 6px; font-size:14px; }
  #panel label{ display:flex; justify-content:space-between; align-items:center; font-size:13px; margin:5px 0; gap:8px;}
  #panel input,#panel select,#panel textarea{ width:150px; padding:5px; font-size:12px; }
  #panel textarea{ width:100%; height:70px; font-family:monospace; }
  #panel .json{ height:150px; }
  .row{ display:flex; gap:6px; }
  .row .btn{ background:#ddd; color:#222; }
  .x{ position:absolute; top:8px; right:12px; font-size:22px; }
  .hint{ font-size:11px; color:#555; margin:4px 0 10px; }
  #three{ position:fixed; inset:0; z-index:8; display:none; background:#aeb4ba; }
  #three.on{ display:block; }
  #three .x3{ position:fixed; top:10px; right:14px; z-index:9; font-size:22px; color:#111; background:#fff9; border-radius:18px; width:38px; height:38px; text-align:center; line-height:38px; }
  #three .u3{ position:fixed; top:12px; left:14px; z-index:9; background:var(--accent); color:#fff; border:none; padding:9px 14px; border-radius:8px; font-size:13px; }
  #three .tag{ position:fixed; bottom:14px; left:0; right:0; text-align:center; color:#333; font-size:12px; }
  #three .modes{ position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:9; display:flex; gap:4px; }
  #three .modes button{ background:#3a3a3acc; color:#eee; border:none; padding:8px 12px; border-radius:8px; font-size:13px; }
  #three .modes button.on{ background:var(--accent); color:#fff; }
  #three .vfl{ top:52px; }
  .dlab{ position:fixed; z-index:9; font-size:11px; color:#123; background:#fffb; padding:1px 5px; border-radius:4px; transform:translateY(-50%); white-space:nowrap; pointer-events:none; display:none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <b>間取り</b>
  <span class="lv on" data-lv="1F">1F</span>
  <span class="lv" data-lv="2F">2F</span>
  <span class="lv" id="btnplan" style="margin-left:auto">平面図</span>
  <span class="lv" id="btn3d" style="background:#2f6db0">3D ▶</span>
  <span id="stat"></span>
</div>
<button id="planpng" style="display:none;position:fixed;top:44px;right:10px;z-index:6;background:#333;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:13px">PNG保存</button>
<div id="bar">
  <button class="btn on" data-tool="select">選択</button>
  <button class="btn" data-tool="wall_outer">外壁</button>
  <button class="btn" data-tool="wall_inner">内壁</button>
  <button class="btn" data-tool="opening">開口</button>
  <button class="btn" data-tool="fitting">建具</button>
  <button class="btn" data-tool="floor">床</button>
  <button class="btn" data-tool="room">室</button>
  <button class="btn act" id="undo">戻す</button>
  <button class="btn act" id="menu">≡</button>
</div>

<div id="axisbox">
  <span class="nm" id="ax_nm">X1</span>
  <button data-d="-455">−455</button><button data-d="-91">−91</button>
  <span id="ax_pos">0</span>
  <button data-d="91">+91</button><button data-d="455">+455</button>
  <button id="ax_close">✓</button>
</div>

<div class="sheet" id="sheet"></div>

<div id="three">
  <div class="x3" id="c3d">×</div>
  <button class="u3" id="u3d">↻ 更新</button>
  <div class="modes" id="modes"><button data-m="3d" class="on">3D</button><button data-m="elevX">X立面</button><button data-m="elevY">Y立面</button></div>
  <div class="modes vfl" id="vfloors"><button data-f="all" class="on">全体</button><button data-f="le2">〜2F</button><button data-f="1F">1F</button></div>
  <div class="tag">ドラッグ=回転 / ピンチ=ズーム / 2本指=移動</div>
</div>

<div id="panel">
  <div class="x" id="close">×</div>
  <h3>グリッド（通り芯）</h3>
  <label>初期ピッチ(mm)<input id="g_pitch" type="number" value="910"></label>
  <label>X通り数<input id="g_x" type="number" value="14"></label>
  <label>Y通り数<input id="g_y" type="number" value="11"></label>
  <div class="row"><button class="btn" id="g_apply">等ピッチで再生成</button></div>
  <div class="hint">通り芯番号をタップ→移動（−/＋ or ドラッグ）。要素は通り芯に追従。</div>

  <h3>基準高さ datum(mm)</h3>
  <textarea id="datums"></textarea>
  <div class="hint">壁は下基準+H0〜上基準+H1で定義。ここは name:mm を1行ずつ。</div>

  <h3>屋根（母屋）</h3>
  <label>種別<select id="r_type"><option value="gable">切妻</option><option value="none">なし</option></select></label>
  <label>棟通り(X)<input id="r_ridge" type="number" value="7.5" step="0.5"></label>
  <label>勾配(度)<input id="r_pitch" type="number" value="20"></label>
  <label>棟高(mm)<input id="r_z" type="number" value="6960"></label>
  <label>軒の出(mm)<input id="r_ov" type="number" value="600"></label>
  <label>左右等勾配<input id="r_eq" type="checkbox" checked></label>

  <h3>JSON (house.json)</h3>
  <div class="row"><button class="btn" id="export">生成/更新</button><button class="btn" id="copy">コピー</button><button class="btn" id="dl">保存</button></div>
  <div class="row" style="margin-top:6px"><button class="btn" id="import">取込</button><button class="btn" id="loadex">例</button><button class="btn" id="clear">全消去</button></div>
  <textarea id="json" class="json" spellcheck="false"></textarea>
</div>

<script>
"use strict";
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const DEF_DATUMS={ "GL":0,"1FL":600,"1CL":2900,"2FL":3110,"2F梁天端":3100,"2CL":4930,"軒高":5340,"棟高":6960 };
const S={ gx:[], gy:[], pitch:910, datums:Object.assign({},DEF_DATUMS),
  walls:[], openings:[], floors:[], rooms:[], fittings:[],
  roof:{type:"gable",ridge:7.5,pitch:20,z:6960,ov:600,eq:true} };
const FITTYPES=["引戸","開き戸","片引戸","両引戸","襖","障子"];
function uniform(n,p){ const a=[]; for(let i=0;i<n;i++)a.push(i*p); return a; }
S.gx=uniform(14,910); S.gy=uniform(11,910);
let view={s:0.06,px:0,py:0};
let cur={lv:"1F",tool:"select",p1:null,floorPts:null,sel:null,axis:null};
let uid=0;
const LOFF=30;   // 通り芯番号を根本から延長する画面px量（外壁と誤タップしないため）
let planView=false;   // 平面図（白黒・作図）表示モード

const NX=()=>S.gx.length, NY=()=>S.gy.length;
const WX=()=>S.gx[S.gx.length-1], WY=()=>S.gy[S.gy.length-1];
function sx(x){return view.px+x*view.s;} function sy(y){return view.py-y*view.s;}
function wx(p){return (p-view.px)/view.s;} function wy(p){return (view.py-p)/view.s;}
function nidx(arr,v){ let bi=0,bd=1e9; for(let i=0;i<arr.length;i++){const d=Math.abs(arr[i]-v);if(d<bd){bd=d;bi=i;}} return bi; }
function snap(px,py){ return {i:nidx(S.gx,wx(px)), j:nidx(S.gy,wy(py))}; }
function PW(i,j){ return [S.gx[i], S.gy[j]]; }               // grid index -> world
function tok(a,i){ return a+(i+1); }
function idxTok(t){ return parseInt(t.slice(1),10)-1; }
function openSeg(o){ const w=S.walls.find(w=>w.id===o.host); if(!w)return null;
  const A=PW(w.a.i,w.a.j),B=PW(w.b.i,w.b.j); let dx=B[0]-A[0],dy=B[1]-A[1]; const L=Math.hypot(dx,dy)||1; dx/=L;dy/=L;
  const P=PW(o.at.i,o.at.j); const hw=(o.width||1200)/2;
  return {a:[P[0]-dx*hw,P[1]-dy*hw], b:[P[0]+dx*hw,P[1]+dy*hw]}; }
function segDistW(px,py,A,B){ const x1=sx(A[0]),y1=sy(A[1]),x2=sx(B[0]),y2=sy(B[1]); const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;
  let t=L?((px-x1)*dx+(py-y1)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(x1+t*dx),py-(y1+t*dy)); }

function resize(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); draw(); }
addEventListener('resize',resize);
function fit(){ const m=64; const sw=(innerWidth-2*m)/(WX()||1), sh=(innerHeight-2*m-130)/(WY()||1);
  view.s=Math.min(sw,sh); view.px=m+(innerWidth-2*m-WX()*view.s)/2; view.py=innerHeight-80-(innerHeight-140-WY()*view.s)/2; }

function draw(){
  if(planView){ drawPlan(); return; }
  ctx.clearRect(0,0,innerWidth,innerHeight);
  // grid + labels
  ctx.lineWidth=1; ctx.font="11px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  const gy0=S.gy[0], gx0=S.gx[0];
  for(let i=0;i<NX();i++){ const x=S.gx[i]; const on=cur.axis&&cur.axis.a==='x'&&cur.axis.i===i;
    ctx.strokeStyle=on?"#e33":"#cfcfcf"; ctx.lineWidth=on?2:1;
    ctx.beginPath(); ctx.moveTo(sx(x),sy(gy0)); ctx.lineTo(sx(x),sy(WY())); ctx.stroke();
    ctx.strokeStyle=on?"#e33":"#b0b0b0"; ctx.lineWidth=1;   // 根本延長スタブ
    ctx.beginPath(); ctx.moveTo(sx(x),sy(gy0)); ctx.lineTo(sx(x),sy(gy0)+LOFF); ctx.stroke();
    ctx.fillStyle=on?"#e33":"#5a5a5a"; ctx.fillText("X"+(i+1), sx(x), sy(gy0)+LOFF+8); }
  for(let j=0;j<NY();j++){ const y=S.gy[j]; const on=cur.axis&&cur.axis.a==='y'&&cur.axis.i===j;
    ctx.strokeStyle=on?"#e33":"#cfcfcf"; ctx.lineWidth=on?2:1;
    ctx.beginPath(); ctx.moveTo(sx(gx0),sy(y)); ctx.lineTo(sx(WX()),sy(y)); ctx.stroke();
    ctx.strokeStyle=on?"#e33":"#b0b0b0"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx(gx0),sy(y)); ctx.lineTo(sx(gx0)-LOFF,sy(y)); ctx.stroke();
    ctx.fillStyle=on?"#e33":"#5a5a5a"; ctx.fillText("Y"+(j+1), sx(gx0)-LOFF-11, sy(y)); }
  // floors
  for(const f of S.floors){ if(f.level!==cur.lv)continue; ctx.fillStyle="rgba(47,109,176,.08)";
    ctx.beginPath(); f.pts.forEach((p,k)=>{const w=PW(p.i,p.j); k?ctx.lineTo(sx(w[0]),sy(w[1])):ctx.moveTo(sx(w[0]),sy(w[1]));}); ctx.closePath(); ctx.fill(); }
  // rooms (name at centroid)
  for(const r of S.rooms){ if(r.level!==cur.lv)continue; let cx=0,cy=0; r.pts.forEach(p=>{const w=PW(p.i,p.j);cx+=w[0];cy+=w[1];}); cx/=r.pts.length; cy/=r.pts.length;
    ctx.fillStyle="#333"; ctx.font="13px sans-serif"; ctx.fillText(r.name||"室", sx(cx), sy(cy)); }
  // walls
  for(const w of S.walls){ const other=w.level!==cur.lv; const seld=cur.sel&&cur.sel.o===w;
    ctx.lineWidth=(w.kind==="outer"?7:4)+(seld?3:0);
    ctx.strokeStyle= seld?"#e33": other?"#9aa0a6":(w.kind==="outer"?"#111":"#3a6ea5");
    ctx.setLineDash(other?[6,6]:[]); const a=PW(w.a.i,w.a.j),b=PW(w.b.i,w.b.j);
    ctx.beginPath(); ctx.moveTo(sx(a[0]),sy(a[1])); ctx.lineTo(sx(b[0]),sy(b[1])); ctx.stroke(); }
  ctx.setLineDash([]);
  // openings（幅に応じた太線でホスト壁に沿って表示）
  for(const o of S.openings){ if(o.level!==cur.lv)continue; const sg=openSeg(o); if(!sg)continue; const seld=cur.sel&&cur.sel.o===o;
    ctx.strokeStyle= seld?"#e33":(o.type==="door"?"#0a7d2c":"#0aa"); ctx.lineWidth=seld?10:8; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(sx(sg.a[0]),sy(sg.a[1])); ctx.lineTo(sx(sg.b[0]),sy(sg.b[1])); ctx.stroke(); ctx.lineCap="butt"; }
  // 内部建具（幅に応じた太線・破線で表示）
  for(const o of S.fittings){ if(o.level!==cur.lv)continue; const sg=openSeg(o); if(!sg)continue; const seld=cur.sel&&cur.sel.o===o;
    ctx.strokeStyle= seld?"#e33":"#c07a2b"; ctx.lineWidth=seld?9:7; ctx.lineCap="round"; ctx.setLineDash([9,5]);
    ctx.beginPath(); ctx.moveTo(sx(sg.a[0]),sy(sg.a[1])); ctx.lineTo(sx(sg.b[0]),sy(sg.b[1])); ctx.stroke(); ctx.setLineDash([]); ctx.lineCap="butt"; }
  // in-progress
  if(cur.p1){ const w=PW(cur.p1.i,cur.p1.j); ctx.fillStyle="#e33"; ctx.beginPath(); ctx.arc(sx(w[0]),sy(w[1]),7,0,7); ctx.fill(); }
  if(cur.floorPts){ ctx.strokeStyle="#e33"; ctx.lineWidth=2; ctx.setLineDash([4,4]); ctx.beginPath();
    cur.floorPts.forEach((p,k)=>{const w=PW(p.i,p.j); k?ctx.lineTo(sx(w[0]),sy(w[1])):ctx.moveTo(sx(w[0]),sy(w[1]));}); ctx.stroke(); ctx.setLineDash([]); }
  document.getElementById('stat').textContent=`壁${S.walls.length} 開${S.openings.length} 建具${S.fittings.length} 床${S.floors.length} 室${S.rooms.length}`;
}

// ---- 平面図（白黒・作図）----
function _u(A,B){ const dx=B[0]-A[0],dy=B[1]-A[1]; const L=Math.hypot(dx,dy)||1; return [dx/L,dy/L]; }
function wallFootprint(A,B,t){ const [ux,uy]=_u(A,B); const px=-uy,py=ux,e=t/2,h=t/2;
  return [[A[0]-ux*e+px*h,A[1]-uy*e+py*h],[A[0]-ux*e-px*h,A[1]-uy*e-py*h],[B[0]+ux*e-px*h,B[1]+uy*e-py*h],[B[0]+ux*e+px*h,B[1]+uy*e+py*h]]; }
function fillPolyW(poly,style){ ctx.fillStyle=style; ctx.beginPath(); poly.forEach((p,i)=>{i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1]));}); ctx.closePath(); ctx.fill(); }
function lineW(a,b,style,w){ ctx.strokeStyle=style;ctx.lineWidth=w||1;ctx.beginPath();ctx.moveTo(sx(a[0]),sy(a[1]));ctx.lineTo(sx(b[0]),sy(b[1]));ctx.stroke(); }
function lineS(x1,y1,x2,y2){ ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke(); }
function drawFitting(o,cat){ const w=S.walls.find(x=>x.id===o.host); if(!w)return; const A=PW(w.a.i,w.a.j),B=PW(w.b.i,w.b.j);
  const [ux,uy]=_u(A,B); const px=-uy,py=ux; const t=w.thickness||(w.kind==='outer'?150:105); const C=PW(o.at.i,o.at.j); const hw=(o.width||900)/2;
  const P=(s,d)=>[C[0]+ux*s+px*d, C[1]+uy*s+py*d];
  fillPolyW([P(-hw,t/2+3),P(-hw,-t/2-3),P(hw,-t/2-3),P(hw,t/2+3)],'#fff');   // 壁を開口で抜く
  lineW(P(-hw,t/2),P(-hw,-t/2),'#111',1.6); lineW(P(hw,t/2),P(hw,-t/2),'#111',1.6);  // 方立(ジャム)
  if(cat==='window'){ lineW(P(-hw,t/6),P(hw,t/6),'#111',1); lineW(P(-hw,-t/6),P(hw,-t/6),'#111',1); lineW(P(-hw,0),P(hw,0),'#111',1); }
  else if(cat==='hinge'){ const hinge=P(-hw,0); const openPt=P(-hw,2*hw); const dE=P(hw,0);
    lineW(hinge,openPt,'#111',1.6);   // 開いた扉の葉
    const cX=sx(hinge[0]),cY=sy(hinge[1]); const oX=sx(openPt[0]),oY=sy(openPt[1]); const eX=sx(dE[0]),eY=sy(dE[1]);
    const r=Math.hypot(oX-cX,oY-cY); const aC=Math.atan2(eY-cY,eX-cX), aO=Math.atan2(oY-cY,oX-cX);
    let d=aO-aC; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;   // 90°側(短い弧)を描く
    ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cX,cY,r,aC,aO,d<0);ctx.stroke(); }
  else { lineW(P(-hw,t/5),P(hw*0.08,t/5),'#111',2.2); lineW(P(-hw*0.08,-t/5),P(hw,-t/5),'#111',2.2); }  // 引戸(2枚)
}
function drawPlan(){
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,innerWidth,innerHeight);
  const lv=cur.lv, gy0=S.gy[0], gx0=S.gx[0];
  for(let i=0;i<NX();i++) lineW([S.gx[i],gy0],[S.gx[i],WY()],'#e3e3e3',1);
  for(let j=0;j<NY();j++) lineW([gx0,S.gy[j]],[WX(),S.gy[j]],'#e3e3e3',1);
  ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<NX();i++){ const X=sx(S.gx[i]),Y=sy(gy0)+LOFF+4; ctx.strokeStyle='#333';ctx.lineWidth=1; lineS(X,sy(gy0),X,Y-11);
    ctx.beginPath();ctx.arc(X,Y,11,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.fillText('X'+(i+1),X,Y); }
  for(let j=0;j<NY();j++){ const X=sx(gx0)-LOFF-4,Y=sy(S.gy[j]); ctx.strokeStyle='#333';ctx.lineWidth=1; lineS(sx(gx0),Y,X+11,Y);
    ctx.beginPath();ctx.arc(X,Y,11,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.fillText('Y'+(j+1),X,Y); }
  for(const w of S.walls){ if(w.level!==lv)continue; const A=PW(w.a.i,w.a.j),B=PW(w.b.i,w.b.j); if(A[0]===B[0]&&A[1]===B[1])continue;
    fillPolyW(wallFootprint(A,B,w.thickness||(w.kind==='outer'?150:105)),'#111'); }
  const items=[...S.openings.filter(o=>o.level===lv).map(o=>({o,cat:o.type==='door'?'hinge':'window'})),
               ...S.fittings.filter(o=>o.level===lv).map(o=>({o,cat:(o.type==='開き戸')?'hinge':'slide'}))];
  for(const it of items) drawFitting(it.o,it.cat);
  ctx.fillStyle='#111'; ctx.textAlign='center'; ctx.font='13px sans-serif';
  for(const r of S.rooms){ if(r.level!==lv)continue; let cx=0,cy=0; r.pts.forEach(p=>{const q=PW(p.i,p.j);cx+=q[0];cy+=q[1];}); cx/=r.pts.length;cy/=r.pts.length; ctx.fillText(r.name||'室',sx(cx),sy(cy)); }
  ctx.fillStyle='#111';ctx.textAlign='left';ctx.font='15px sans-serif'; ctx.fillText(lv+' 平面図',14,innerHeight-72);
  document.getElementById('stat').textContent='平面図 '+lv;
}

// ---- input ----
let ptrs=new Map(), moved=false, downXY=null, pinch=null, dragAxis=false;
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false; downXY={x:e.clientX,y:e.clientY};
  dragAxis = cur.tool==='select' && cur.axis && hitAxis(e.clientX,e.clientY,cur.axis);
  if(ptrs.size===2){ const a=[...ptrs.values()]; pinch={d:dist(a[0],a[1]),s:view.s,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,px:view.px,py:view.py}; } });
cv.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId))return; const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){ const a=[...ptrs.values()]; const nd=dist(a[0],a[1]); const r=nd/pinch.d; const ncx=(a[0].x+a[1].x)/2,ncy=(a[0].y+a[1].y)/2;
    view.s=Math.max(0.006,Math.min(0.6,pinch.s*r)); view.px=ncx-(pinch.cx-pinch.px)*(view.s/pinch.s); view.py=ncy-(pinch.cy-pinch.py)*(view.s/pinch.s); moved=true; draw(); return; }
  if(ptrs.size===1){ const dx=e.clientX-downXY.x,dy=e.clientY-downXY.y; if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    if(dragAxis){ moveAxisTo(cur.axis, e.clientX, e.clientY); draw(); return; }
    if(moved && !cur.p1 && !cur.floorPts){ view.px+=e.clientX-prev.x; view.py+=e.clientY-prev.y; draw(); } } });
cv.addEventListener('pointerup',e=>{ const two=ptrs.size===2; ptrs.delete(e.pointerId); if(ptrs.size<2)pinch=null;
  if(dragAxis){ dragAxis=false; if(moved){syncAxisBox(); moved=false; return;} }
  if(!moved && !two) tap(e.clientX,e.clientY); moved=false; });
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function inXgutter(py){ const b=sy(S.gy[0]); return py>b+10 && py<b+LOFF+22; }
function inYgutter(px){ const b=sx(S.gx[0]); return px<b-10 && px>b-LOFF-24; }
function hitAxis(px,py,ax){ if(ax.a==='x') return Math.abs(px-sx(S.gx[ax.i]))<20; return Math.abs(py-sy(S.gy[ax.i]))<20; }
function moveAxisTo(ax,px,py){ if(ax.a==='x'){ let v=Math.round(wx(px)/5)*5; v=clampAxis(S.gx,ax.i,v); S.gx[ax.i]=v; } else { let v=Math.round(wy(py)/5)*5; v=clampAxis(S.gy,ax.i,v); S.gy[ax.i]=v; } }
function clampAxis(arr,i,v){ const lo=i>0?arr[i-1]+100:-1e9, hi=i<arr.length-1?arr[i+1]-100:1e9; return Math.max(lo,Math.min(hi,v)); }

function tap(px,py){
  if(planView) return;   // 平面図モードは閲覧のみ
  if(cur.tool==='select'){
    // axis label?
    if(inXgutter(py)){ selectAxis('x', nidx(S.gx,wx(px))); return; }
    if(inYgutter(px)){ selectAxis('y', nidx(S.gy,wy(py))); return; }
    const hit=pick(px,py); if(hit){ closeAxis(); selectEl(hit); } else { closeAxis(); clearSel(); }
    draw(); return;
  }
  const sn=snap(px,py);
  if(cur.tool==='wall_outer'||cur.tool==='wall_inner'){
    if(!cur.p1){ cur.p1=sn; } else { if(cur.p1.i!==sn.i||cur.p1.j!==sn.j){ const outer=cur.tool==='wall_outer';
      S.walls.push({id:"W"+(++uid),kind:outer?"outer":"inner",level:cur.lv,a:{...cur.p1},b:{...sn},
        thickness:outer?150:105,finish:"",base:cur.lv==='1F'?"1FL":"2FL",top:cur.lv==='1F'?"2F梁天端":"軒高",h0:0,h1:0}); }
      cur.p1=null; }
  } else if(cur.tool==='opening'){ const w=nearestWall(px,py); if(w){
      S.openings.push({id:"O"+(++uid),host:w.id,level:cur.lv,at:{...sn},width:1650,sill:400,head:2200,type:"window"}); } }
  else if(cur.tool==='fitting'){ const w=nearestWall(px,py,true); if(w){
      S.fittings.push({id:"K"+(++uid),host:w.id,level:cur.lv,at:{...sn},width:1650,sill:0,head:2000,type:"引戸"}); } }
  else if(cur.tool==='floor'){ if(!cur.floorPts)cur.floorPts=[];
      if(cur.floorPts.length>=3 && cur.floorPts[0].i===sn.i && cur.floorPts[0].j===sn.j){ S.floors.push({id:"F"+(++uid),level:cur.lv,pts:cur.floorPts,finish:"無垢フローリング"}); cur.floorPts=null; }
      else cur.floorPts.push(sn); }
  else if(cur.tool==='room'){ const rm=detectRoom(px,py); if(rm){ const nm=prompt("室名",""); if(nm!==null){ S.rooms.push({id:"R"+(++uid),name:nm||"室",level:cur.lv,pts:rm}); } } else alert("壁で囲まれた室が見つかりません"); }
  draw();
}

// ---- pick / select element ----
function segDist(px,py,a,b){ const A=PW(a.i,a.j),B=PW(b.i,b.j); const x1=sx(A[0]),y1=sy(A[1]),x2=sx(B[0]),y2=sy(B[1]);
  const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy; let t=L?((px-x1)*dx+(py-y1)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(x1+t*dx),py-(y1+t*dy)); }
function nearestWall(px,py,preferInner){ let best=null,bd=26; const pool=preferInner?S.walls.filter(w=>w.kind==='inner'):S.walls;
  for(const w of pool){ if(w.level!==cur.lv)continue; const d=segDist(px,py,w.a,w.b); if(d<bd){bd=d;best=w;} }
  if(!best&&preferInner) return nearestWall(px,py,false); return best; }
function pick(px,py){ // openings/建具 first, then walls, then rooms
  for(const o of S.openings){ if(o.level!==cur.lv)continue; const sg=openSeg(o); if(sg && segDistW(px,py,sg.a,sg.b)<12) return {type:'opening',o}; }
  for(const o of S.fittings){ if(o.level!==cur.lv)continue; const sg=openSeg(o); if(sg && segDistW(px,py,sg.a,sg.b)<12) return {type:'fitting',o}; }
  const w=nearestWall(px,py); if(w) return {type:'wall',o:w};
  for(const r of S.rooms){ if(r.level!==cur.lv)continue; if(ptInPoly(wx(px),wy(py),r.pts)) return {type:'room',o:r}; }
  for(const f of S.floors){ if(f.level!==cur.lv)continue; if(ptInPoly(wx(px),wy(py),f.pts)) return {type:'floor',o:f}; }
  return null; }
function ptInPoly(x,y,pts){ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const A=PW(pts[i].i,pts[i].j),B=PW(pts[j].i,pts[j].j);
  if(((A[1]>y)!==(B[1]>y)) && (x<(B[0]-A[0])*(y-A[1])/(B[1]-A[1])+A[0])) c=!c; } return c; }
function clearSel(){ cur.sel=null; document.getElementById('sheet').classList.remove('open'); }
function selectEl(hit){ cur.sel=hit; buildSheet(hit); }

// ---- sheet ----
function buildSheet(hit){ const s=document.getElementById('sheet'); const o=hit.o; let html="";

  } else if(hit.type==='fitting'){ html=`<h4>建具 ${o.id}</h4>

function delEl(hit){ if(hit.type==='wall'){ S.walls=S.walls.filter(x=>x!==hit.o); S.openings=S.openings.filter(o=>o.host!==hit.o.id); }
  else if(hit.type==='opening') S.openings=S.openings.filter(x=>x!==hit.o);

// ---- rooms: planar face detection ----
function detectRoom(px,py){ const faces=facesAt(cur.lv); const X=wx(px),Y=wy(py); let best=null,ba=1e18;
  for(const f of faces){ if(ptInPolyW(X,Y,f.poly) && f.area<ba){ ba=f.area; best=f; } }
  return best? best.idx : null; }
function ptInPolyW(x,y,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const A=poly[i],B=poly[j];
  if(((A[1]>y)!==(B[1]>y)) && (x<(B[0]-A[0])*(y-A[1])/(B[1]-A[1])+A[0])) c=!c; } return c; }
function facesAt(level){ const ws=S.walls.filter(w=>w.level===level); const key=p=>p.i+','+p.j;
  // 全ノード（内壁端が外壁の途中に接するT字も分割点にする）
  const nset={}; ws.forEach(w=>{nset[key(w.a)]=w.a; nset[key(w.b)]=w.b;}); const allN=Object.values(nset);
  const segs=[];
  for(const w of ws){ const A=PW(w.a.i,w.a.j),B=PW(w.b.i,w.b.j); const abx=B[0]-A[0],aby=B[1]-A[1]; const L2=abx*abx+aby*aby; if(L2<1)continue;
    const on=[{t:0,p:w.a},{t:1,p:w.b}];
    for(const c of allN){ if((c.i===w.a.i&&c.j===w.a.j)||(c.i===w.b.i&&c.j===w.b.j))continue; const C=PW(c.i,c.j);
      const t=((C[0]-A[0])*abx+(C[1]-A[1])*aby)/L2; if(t<=0.001||t>=0.999)continue;
      const d=Math.hypot(C[0]-(A[0]+abx*t), C[1]-(A[1]+aby*t)); if(d<1) on.push({t,p:c}); }
    on.sort((u,v)=>u.t-v.t);
    for(let k=0;k<on.length-1;k++){ const p=on[k].p,q=on[k+1].p; if(p.i!==q.i||p.j!==q.j) segs.push([p,q]); } }
  const nodes={};
  const add=(a,b)=>{ const A=PW(a.i,a.j),B=PW(b.i,b.j); const ang=Math.atan2(B[1]-A[1],B[0]-A[0]);
    const he={a,b,ang,used:false}; (nodes[key(a)]=nodes[key(a)]||[]).push(he); return he; };
  const HE=[]; for(const s of segs){ HE.push(add(s[0],s[1])); HE.push(add(s[1],s[0])); }
  for(const k in nodes) nodes[k].sort((p,q)=>p.ang-q.ang);
  const faces=[];
  for(const h0 of HE){ if(h0.used)continue; const pts=[]; let he=h0,g=0;
    do{ he.used=true; pts.push(he.a); const out=nodes[key(he.b)]; if(!out){break;}
      let idx=out.findIndex(e=>e.b.i===he.a.i&&e.b.j===he.a.j); if(idx<0)break; const n=out.length; he=out[(idx-1+n)%n]; g++; }
    while(he!==h0 && g<4000);
    if(pts.length>=3){ const poly=pts.map(p=>PW(p.i,p.j)); let ar=0; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ ar+=poly[j][0]*poly[i][1]-poly[i][0]*poly[j][1]; } ar/=2;
      if(ar>1) faces.push({idx:pts,poly,area:ar}); } }
  return faces; }

function buildHouse(){ const T=(a,i)=>a+(i+1);
  const walls=S.walls.map(w=>({id:w.id,kind:w.kind,level:w.level,from:[T('X',w.a.i),T('Y',w.a.j)],to:[T('X',w.b.i),T('Y',w.b.j)],
    thickness:w.thickness,finish:w.finish||"",base:w.base,h0:w.h0||0,top:w.top,h1:w.h1||0}));
  const openings=S.openings.map(o=>({id:o.id,host:o.host,level:o.level,at:[T('X',o.at.i),T('Y',o.at.j)],width:o.width,sill:o.sill,head:o.head,type:o.type}));
  const fittings=S.fittings.map(o=>({id:o.id,host:o.host,level:o.level,at:[T('X',o.at.i),T('Y',o.at.j)],width:o.width,sill:o.sill,head:o.head,type:o.type}));
  const floors=S.floors.map(f=>({id:f.id,level:f.level,finish:f.finish||"",boundary:f.pts.map(p=>[T('X',p.i),T('Y',p.j)])}));
  const rooms=S.rooms.map(r=>({id:r.id,name:r.name,level:r.level,boundary:r.pts.map(p=>[T('X',p.i),T('Y',p.j)])}));
  const h={ schema:"wood-house/0.2", units:"mm",
    grid:{pitch:S.pitch,x_axes:NX(),y_axes:NY(),x_positions:S.gx.slice(),y_positions:S.gy.slice(),origin:[0,0,0]},
    datums:S.datums,
    levels:[{id:"1F",fl:S.datums["1FL"]||600,cl:S.datums["1CL"]||2900},{id:"2F",fl:S.datums["2FL"]||3110,cl:S.datums["2CL"]||4930}],
    walls, openings, fittings, floors, rooms };
  if(S.roof.type==="gable"){ const foot=topFoot(); if(foot) h.roof={outlines:[{id:"母屋",type:"gable",boundary:foot,overhang:S.roof.ov,
    ridge:{axis:"X"+S.roof.ridge,z:S.roof.z},pitch_deg:S.roof.pitch,equal_pitch:S.roof.eq,eave_h0:[0,0],finish:"ガルバリウム立平"}]}; }
  return h; }
function topFoot(){ let ws=S.walls.filter(w=>w.kind==="outer"&&w.level==="2F"); if(!ws.length)ws=S.walls.filter(w=>w.kind==="outer"); if(!ws.length)return null;
  let is=[],js=[]; ws.forEach(w=>{is.push(w.a.i,w.b.i);js.push(w.a.j,w.b.j);}); const i0=Math.min(...is),i1=Math.max(...is),j0=Math.min(...js),j1=Math.max(...js);
  return [["X"+(i0+1),"Y"+(j0+1)],["X"+(i1+1),"Y"+(j0+1)],["X"+(i1+1),"Y"+(j1+1)],["X"+(i0+1),"Y"+(j1+1)]]; }

  const pts=o.boundary.map(p=>rp(p,h.grid)); const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]); const ov=o.overhang||0;

  // 屋根面と厳密一致させるため、棟(ridge)を横切る位置を折れ点に（面は区間内で線形＝完全一致）
  const bps=[0,len];
  if(h.roof&&h.roof.outlines){ for(const o of h.roof.outlines){ if(o.type!=='gable'||!o.ridge)continue;

function clearRoot(){ scene.remove(root); root.traverse(o=>{if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose();}); root=new THREE.Group(); scene.add(root); }
function panel(xa,za,xb,zb,y0,y1){ const gg=new THREE.BufferGeometry(); gg.setAttribute('position',new THREE.Float32BufferAttribute([xa,za,-y0,xb,zb,-y0,xb,zb,-y1,xa,za,-y1],3)); gg.setIndex([0,1,2,0,2,3]); gg.computeVertexNormals(); return new THREE.Mesh(gg,new THREE.MeshLambertMaterial({color:0x9a9a9f,side:THREE.DoubleSide})); }

function build(){ if(!inited)return; clearRoot(); const h=window.getHouse(); const g=h.grid; const lv={}; (h.levels||[]).forEach(l=>lv[l.id]=l);

    let z0,z1; if(w.base&&h.datums){ z0=zOf(h,w.base,w.h0); z1=zOf(h,w.top,w.h1); } else { const L=lv[w.level]||{fl:0,cl:2500}; z0=L.fl; z1=L.cl; }

  for(const f of (h.floors||[])){ const L=lv[f.level]||{fl:0}; const sh=new THREE.Shape(); (f.boundary||[]).forEach((p,i)=>{const q=rp(p,g); i?sh.lineTo(q[0],q[1]):sh.moveTo(q[0],q[1]);});
    const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshLambertMaterial({color:0xd6cfc2,side:THREE.DoubleSide})); m.rotation.x=-Math.PI/2; m.position.y=(L.fl||0)+2; m.userData.lvl=f.level; root.add(m); }
  const drawOpen=(arr,col)=>{ for(const o of (arr||[])){ const w=(h.walls||[]).find(x=>x.id===o.host); if(!w)continue; const a=rp(w.from,g),b=rp(w.to,g); const ang=Math.atan2(b[1]-a[1],b[0]-a[0]); const at=rp(o.at,g);

  let hW=(mode==='elevX'?s.x:s.z), vH=s.y; hW=Math.max(hW,1000); vH=Math.max(vH,1000); let halfW=hW*0.62,halfH=vH*0.62; if(halfW/halfH<asp)halfW=halfH*asp; else halfH=halfW/asp;

function rebuildDatums(){ datumGrp.clear(); labelEls.forEach(e=>e.remove()); labelEls=[]; labelPos=[];
  if(mode==='3d'||!lastH||!lastH.datums)return; const box=bbox(); if(box.isEmpty())return; const mn=box.min,mx=box.max;
  const mgx=(mx.x-mn.x)*0.10+600, mgz=(mx.z-mn.z)*0.10+600; const mat=new THREE.LineBasicMaterial({color:0x33506e});

    datumGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
    const el=document.createElement('div'); el.className='dlab'; el.textContent=nm+' '+Math.round(z); host.appendChild(el); labelEls.push(el); labelPos.push(lp); } }
function updateLabels(){ for(let i=0;i<labelEls.length;i++){ const v=labelPos[i].clone().project(camera);
    if(v.z<-1||v.z>1){ labelEls[i].style.display='none'; continue; }
    labelEls[i].style.display='block'; labelEls[i].style.left=((v.x*0.5+0.5)*innerWidth)+'px'; labelEls[i].style.top=((-v.y*0.5+0.5)*innerHeight)+'px'; } }
function setMode(m){ mode=m; document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(m==='3d'){ setCam(camP); controls.enableRotate=true; datumGrp.visible=false; frame3D(); }
  else { setCam(camO); controls.enableRotate=false; datumGrp.visible=true; applyOrtho(); }
  rebuildDatums(); }
document.getElementById('btn3d').onclick=()=>{ host.classList.add('on'); if(!inited)init(); onResize(); build(); animate(); };
document.getElementById('c3d').onclick=()=>{ host.classList.remove('on'); labelEls.forEach(e=>e.style.display='none'); };
document.getElementById('u3d').onclick=()=>build();
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#vfloors button').forEach(b=>b.onclick=()=>setVFloor(b.dataset.f));
</script>
</body>
</html>
